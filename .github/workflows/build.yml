name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Unit tests
        run: |
          UDID=$(python3 scripts/pick_simulator.py)
          xcodebuild test \
            -project NoSnooze.xcodeproj \
            -scheme NoSnooze \
            -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build unsigned ipa
        run: |
          xcodebuild build \
            -project NoSnooze.xcodeproj \
            -scheme NoSnooze \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/NoSnooze.app Payload/
          zip -qry NoSnooze.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: NoSnooze-ipa
          path: NoSnooze.ipa
          retention-days: 14
